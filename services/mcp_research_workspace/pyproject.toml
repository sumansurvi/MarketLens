[project]
name = "marketlens-mcp-research-workspace"
version = "0.1.0"
description = "MarketLens research_workspace MCP server (independently runnable process)."
requires-python = ">=3.11"
dependencies = [
  "marketlens-core",
  "mcp>=2.3,<3",
]

[project.scripts]
marketlens-mcp-research-workspace = "mcp_research_workspace.server:main"

[tool.uv.sources]
marketlens-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_research_workspace"
module-root = ""
