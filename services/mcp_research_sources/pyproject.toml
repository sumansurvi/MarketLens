[project]
name = "marketlens-mcp-research-sources"
version = "0.1.0"
description = "MarketLens research_sources MCP server (independently runnable process)."
requires-python = ">=3.11"
dependencies = [
  "marketlens-core",
  "mcp>=2.3,<3",
]

[project.scripts]
marketlens-mcp-research-sources = "mcp_research_sources.server:main"

[tool.uv.sources]
marketlens-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_research_sources"
module-root = ""
