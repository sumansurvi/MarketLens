# Render Blueprint for the MarketLens backend (docs/DEPLOY_VERCEL.md, decision D-94).
# Render dashboard > New > Blueprint > pick this repository and branch. The web app goes on
# Vercel separately and proxies /api/* to the URL Render gives this service.
#
# It starts in demo mode (synthetic fixtures, no API keys, no external calls) so the first deploy
# works as-is. To switch to live data, add the keys listed in docs/DEPLOY_VERCEL.md under the
# service's Environment tab (never in this file) and set APP_MODE/DATA_MODE/LLM_MODE to live.
services:
  - type: web
    name: marketlens-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    # Render plan IDs are CPU and memory sizes. 0.5c-512mb is the smallest paid size: the backend
    # and its three MCP servers use about 290 MB idle (measured 2026-10-13); choose 1c-2g for
    # more headroom with live data. A persistent disk (research history in SQLite) needs a paid
    # instance. On the free plan, delete the `disk` block and set `plan: free`: history then
    # resets on every deploy, and the service sleeps when idle (the next request takes about a minute).
    plan: 0.5c-512mb
    # Close to Vercel's default function region (iad1, Washington D.C.).
    region: virginia
    healthCheckPath: /api/health
    disk:
      name: marketlens-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: demo
      - key: DATA_MODE
        value: fixtures
      - key: LLM_MODE
        value: fixture
      - key: VOICE_MODE
        value: disabled
      - key: DATABASE_URL
        value: sqlite:////data/marketlens.db
      # Random value generated by Render. Copy it into the Vercel project as PROXY_SHARED_SECRET
      # so only your web app can call this backend.
      - key: PROXY_SHARED_SECRET
        generateValue: true
      # Your Vercel address, e.g. https://marketlens.vercel.app (update after the first Vercel deploy).
      - key: FRONTEND_ORIGIN
        value: https://marketlens.vercel.app
      - key: LOG_LEVEL
        value: INFO

  # Optional voice worker ("Lens"). Uncomment after voice works on the backend (VOICE_MODE=livekit
  # and the LiveKit keys there); add the same LIVEKIT_* keys and VOICE_* models here, plus
  # VOICE_BACKEND_URL = this backend's public https URL.
  # - type: worker
  #   name: marketlens-voice
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile.voice
  #   dockerContext: .
  #   plan: 1c-2g    # a safe start: LiveKit's agent server keeps spare job processes (not measured)
  #   region: virginia
  #   envVars:
  #     - key: VOICE_MODE
  #       value: livekit
  #     - key: VOICE_BACKEND_URL
  #       sync: false
